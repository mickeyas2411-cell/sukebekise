<script>
async function saveTelegramUser() {
    const tg = window.Telegram.WebApp;
    const user = tg.initDataUnsafe?.user;

    if (!user) return;

    const { error } = await supabaseClient
        .from("users")
        .upsert({
            telegram_id: user.id,
            first_name: user.first_name
        }, {
            onConflict: "telegram_id"
        });

    if (error) {
        console.error(error);
    }
}

body.dark{

button,input,select,textarea{font:inherit}

.hidden{display:none!important}

/* HEADER */
.header{
background:linear-gradient(135deg,#047857,#059669);
color:white;
padding:18px 15px 20px;

.logo{

}

.icon-btn{

height:40px;
border:0;
border-radius:50%;
background:rgba(255,255,255,.18);
color:white;
font-size:18px;
}

.subtitle{
margin-top:6px;
font-size:12px;
opacity:.9;
}

.search{
margin-top:16px;
background:white;
border-radius:13px;
display:flex;
align-items:center;
padding:0 13px;
}

.search span{font-size:18px}

.search input{

outline:0;
width:100%;
padding:13px 9px;
color:#222;
background:transparent;
}

/* CONTAINER */
.container{
max-width:850px;
margin:auto;
padding:15px;
}

/* SECTION */
.section{margin-top:20px}

.section-head{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:10px;
}

.section-title{
font-size:17px;
font-weight:800;
}

.see-all{
border:0;
background:none;
color:var(--primary);
font-size:12px;
font-weight:bold;
}

/* CATEGORIES */
.categories{
display:flex;
gap:9px;
overflow-x:auto;
padding-bottom:5px;
scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.category{
flex:0 0 auto;
border:1px solid var(--border);
background:var(--card);
color:var(--text);
border-radius:14px;
padding:10px 13px;
font-size:12px;
font-weight:bold;
}

.category.active{
background:var(--primary);
color:white;
border-color:var(--primary);
}

/* VIP */
.vip-scroll{
display:flex;
gap:12px;
overflow-x:auto;
scrollbar-width:none;
}

.vip-scroll::-webkit-scrollbar{display:none}

.vip-card{
flex:0 0 210px;
background:var(--card);
border:2px solid #fbbf24;
border-radius:16px;
overflow:hidden;
position:relative;
}

.vip-img{
height:125px;
background:#e5e7eb;

align-items:center;
justify-content:center;

}

font-weight:bold;
margin-bottom:5px;
}

.vip-price{

font-weight:800;
margin-top:5px;
}

.products{
display:grid;
grid-template-columns:repeat(2,1fr);

}

.product{

border:1px solid var(--border);

position:relative;

align-items:center;

color:#9ca3af;

.product-info{padding:11px}

.product-name{

font-weight:800;

overflow:hidden;

}

.product-price{

font-weight:900;
margin-top:5px;
font-size:14px;
}

.product-location{
color:var(--muted);
font-size:11px;
margin-top:5px;
}

.product-seller{

font-size:11px;
margin-top:3px;

border-radius:50%;

</style>

/* =====================================================
RENDER PRODUCTS
===================================================== */

function renderProducts(){

const container =
document.getElementById("products");

const search =
document.getElementById("searchInput")
.value
.toLowerCase()
.trim();


let list =
products
.filter(p=>p.status==="approved")
.filter(p=>
currentCategory==="all" ||
p.category===currentCategory
)
.filter(p=>
!search ||
p.name.toLowerCase().includes(search) ||
p.description.toLowerCase().includes(search) ||
p.location.toLowerCase().includes(search)
)
.sort((a,b)=>b.created-a.created);


if(!list.length){

container.innerHTML =
'<div class="empty">🔍 ምንም ዕቃ አልተገኘም</div>';

return;

}


container.innerHTML =
list.map(productCard).join("");

}


/* =====================================================
PRODUCT CARD
===================================================== */

function productCard(p){

const isFav =
favorites.includes(p.id);

return `

<article
class="product"
onclick="openDetails(${p.id})">

<button
class="favorite"
onclick="
event.stopPropagation();
toggleFavorite(${p.id})
">

${isFav ? "❤️" : "♡"}

</button>


<div class="product-img">
📷
</div>


<div class="product-info">

<div class="product-name">
${escapeHTML(p.name)}
</div>

<div class="product-price">
${Number(p.price).toLocaleString()} ብር
</div>

<div class="product-location">
📍 ${escapeHTML(p.location)}
</div>

<div class="product-seller">
👤 ${escapeHTML(p.seller)}
</div>

</div>

</article>

`;

}

/* =====================================================
FAVORITES
===================================================== */

function toggleFavorite(id){

if(favorites.includes(id)){

favorites =
favorites.filter(x=>x!==id);

}else{

favorites.push(id);

}

saveData();

renderProducts();

renderFavorites();

updateProfile();

}


function renderFavorites(){

const container =
document.getElementById("favoriteProducts");

const list =
products.filter(
p=>favorites.includes(p.id)
);


if(!list.length){

container.innerHTML =
'<div class="empty">❤️ የምትወዷቸው ዕቃዎች እዚህ ይታያሉ</div>';

return;

}


container.innerHTML =
list.map(productCard).join("");

function showPage(pageId){

const pages = [
"homePage",
"favoritesPage",
"profilePage"
];


pages.forEach(id=>{

document
.getElementById(id)
.classList.add("hidden");

});


document
.getElementById(pageId)
.classList.remove("hidden");


document
.querySelectorAll(".nav-btn")
.forEach(btn=>{

btn.classList.remove(
"active"
);


if(
btn.dataset.page===pageId
){

btn.classList.add(
"active"
);

}

});

}

/* =====================================================
SECURITY
===================================================== */

function escapeHTML(value){

return String(value||"")
.replace(
/&/g,
"&amp;"
)
.replace(
/</g,
"&lt;"
)
.replace(
/>/g,
"&gt;"
)
.replace(
/"/g,
"&quot;"
)
.replace(
/'/g,
"&#039;"
);

}


function escapeAttribute(value){

return String(value||"")
.replace(
/'/g,
"&#039;"
)
.replace(
/"/g,
"&quot;"
);

}

if (tg) {

    tg.ready();
    tg.expand();

    const user = tg.initDataUnsafe?.user;

    if (user) {

        const fullName =
            [user.first_name, user.last_name]
            .filter(Boolean)
            .join(" ");

        const username =
            user.username
            ? "@" + user.username
            : "";

        localStorage.setItem(

            fullName || "Telegram User"
        );

        );

        localStorage.setItem(
            "telegramUserId",
            String(user.id)
        );

    }
}
